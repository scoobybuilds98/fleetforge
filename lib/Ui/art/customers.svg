<svg class="dg dg--art-customers" viewBox="0 0 440 200" xmlns="http://www.w3.org/2000/svg">
  <title>Customer network</title>
  <!-- links: invoices go out, payments come back -->
  <path class="dg-edge--muted" fill="none" d="M165,86 C122,86 112,45 84,45"/>
  <path class="dg-acc-flow" d="M165,100 C120,100 92,110 62,110"/>
  <path class="dg-edge--muted" fill="none" d="M165,114 C126,114 122,168 100,168"/>
  <path class="dg-acc-flow dg-flow--back" d="M275,86 C320,86 330,40 356,40"/>
  <path class="dg-edge--muted" fill="none" d="M275,100 C320,100 352,108 380,108"/>
  <path class="dg-flow dg-flow--qbo dg-flow--back" d="M275,114 C314,114 318,170 340,170"/>
  <circle class="dg-packet--acc" r="4"><animateMotion dur="2.6s" repeatCount="indefinite" path="M165,100 C120,100 92,110 62,110"/></circle>
  <circle class="dg-packet--acc" r="4"><animateMotion dur="2.8s" begin="-1.1s" repeatCount="indefinite" path="M275,86 C320,86 330,40 356,40"/></circle>
  <circle class="dg-packet dg-packet--qbo" r="4"><animateMotion dur="2.8s" begin="-0.6s" repeatCount="indefinite" path="M340,170 C318,170 314,114 275,114"/></circle>

  <!-- hub -->
  <circle class="dg-orbit" cx="220" cy="100" r="62"/>
  <rect class="dg-acc-soft" x="165" y="72" width="110" height="56" rx="14"/>
  <text class="dg-t" x="220" y="97">Your fleet</text>
  <text class="dg-t-sm" x="220" y="114">terms · credit · AR</text>

  <!-- customers -->
  <g class="dg-float">
    <circle class="dg-surface" cx="64" cy="45" r="20"/><text class="dg-t" x="64" y="49" style="font-size:11.5px">RR</text>
    <circle class="dg-dot--ok" cx="78" cy="31" r="4.5"/>
  </g>
  <g class="dg-float dg-float--2">
    <circle class="dg-surface" cx="42" cy="110" r="20"/><text class="dg-t" x="42" y="114" style="font-size:11.5px">CN</text>
    <circle class="dg-dot--ok" cx="56" cy="96" r="4.5"/>
  </g>
  <g class="dg-float">
    <circle class="dg-surface" cx="80" cy="168" r="20"/><text class="dg-t" x="80" y="172" style="font-size:11.5px">TX</text>
    <circle class="dg-dot--warn" cx="94" cy="154" r="4.5"/>
  </g>
  <g class="dg-float dg-float--2">
    <circle class="dg-surface" cx="376" cy="40" r="20"/><text class="dg-t" x="376" y="44" style="font-size:11.5px">BH</text>
    <circle class="dg-dot--ok" cx="390" cy="26" r="4.5"/>
  </g>
  <g class="dg-float">
    <circle class="dg-surface" cx="400" cy="108" r="20"/><text class="dg-t" x="400" y="112" style="font-size:11.5px">MW</text>
    <circle class="dg-dot--danger" cx="414" cy="94" r="4.5"/>
  </g>
  <g class="dg-float dg-float--2">
    <circle class="dg-surface" cx="360" cy="170" r="20"/><text class="dg-t" x="360" y="174" style="font-size:11.5px">PT</text>
    <circle class="dg-dot--ok" cx="374" cy="156" r="4.5"/>
  </g>
</svg>

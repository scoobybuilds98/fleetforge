<svg class="dg dg--art-compliance" viewBox="0 0 440 200" xmlns="http://www.w3.org/2000/svg">
  <title>Papers on the clock</title>
  <!-- the shield: every unit watched -->
  <circle class="dg-pulse" cx="70" cy="100" r="30"/>
  <circle class="dg-pulse dg-pulse--2" cx="70" cy="100" r="30"/>
  <g class="dg-float">
    <path class="dg-acc-soft" d="M70,30 L114,46 V94 C114,128 96,152 70,166 C44,152 26,128 26,94 V46 Z"/>
    <path class="dg-check" d="M52,98 l12,12 l24,-26"/>
  </g>
  <text class="dg-t-xs" x="70" y="188">ROAD-LEGAL</text>

  <!-- one row per unit: CVI + registration status -->
  <rect class="dg-surface" x="136" y="22" width="164" height="44" rx="10"/>
  <text class="dg-t-chip dg-t-start" x="150" y="48">TR-104</text>
  <rect class="dg-ok-soft" x="204" y="33" width="42" height="22" rx="11"/>
  <text class="dg-t-xs dg-t-xs--qbo" x="225" y="48">CVI</text>
  <rect class="dg-ok-soft" x="250" y="33" width="42" height="22" rx="11"/>
  <text class="dg-t-xs dg-t-xs--qbo" x="271" y="48">REG</text>

  <rect class="dg-surface" x="136" y="78" width="164" height="44" rx="10"/>
  <text class="dg-t-chip dg-t-start" x="150" y="104">TR-221</text>
  <rect class="dg-ok-soft" x="204" y="89" width="42" height="22" rx="11"/>
  <text class="dg-t-xs dg-t-xs--qbo" x="225" y="104">CVI</text>
  <rect class="dg-warn-soft" x="250" y="89" width="42" height="22" rx="11"/>
  <text class="dg-t-xs" x="271" y="104">REG</text>

  <rect class="dg-surface" x="136" y="134" width="164" height="44" rx="10"/>
  <text class="dg-t-chip dg-t-start" x="150" y="160">TR-310</text>
  <rect class="dg-panel--danger-soft" x="204" y="145" width="42" height="22" rx="11"/>
  <text class="dg-t-xs" x="225" y="160">CVI</text>
  <circle class="dg-dot--danger" cx="245" cy="146" r="4.5"/>
  <rect class="dg-warn-soft" x="250" y="145" width="42" height="22" rx="11"/>
  <text class="dg-t-xs" x="271" y="160">REG</text>

  <!-- renewal calendar -->
  <rect class="dg-ink" x="340" y="24" width="6" height="16" rx="3"/>
  <rect class="dg-ink" x="398" y="24" width="6" height="16" rx="3"/>
  <rect class="dg-surface" x="318" y="32" width="108" height="140" rx="12"/>
  <path class="dg-acc-faint" d="M330,32 h84 a12,12 0 0 1 12,12 v16 h-108 v-16 a12,12 0 0 1 12,-12 z"/>
  <text class="dg-t-xs" x="372" y="52">RENEWALS</text>
  <g>
    <rect class="dg-surface-2" x="327" y="70" width="18" height="20" rx="4"/><rect class="dg-surface-2" x="351" y="70" width="18" height="20" rx="4"/><rect class="dg-surface-2" x="375" y="70" width="18" height="20" rx="4"/><rect class="dg-surface-2" x="399" y="70" width="18" height="20" rx="4"/>
    <rect class="dg-surface-2" x="327" y="96" width="18" height="20" rx="4"/><rect class="dg-surface-2" x="351" y="96" width="18" height="20" rx="4"/><rect class="dg-surface-2" x="399" y="96" width="18" height="20" rx="4"/>
    <rect class="dg-surface-2" x="327" y="122" width="18" height="20" rx="4"/><rect class="dg-surface-2" x="351" y="122" width="18" height="20" rx="4"/><rect class="dg-surface-2" x="375" y="122" width="18" height="20" rx="4"/><rect class="dg-surface-2" x="399" y="122" width="18" height="20" rx="4"/>
  </g>
  <rect class="dg-warn-soft" x="327" y="122" width="18" height="20" rx="4"/>
  <rect class="dg-ok-soft" x="399" y="70" width="18" height="20" rx="4"/>
  <circle class="dg-pulse" cx="384" cy="106" r="11"/>
  <rect class="dg-acc" x="375" y="96" width="18" height="20" rx="4"/>
  <text class="dg-t-on-acc" x="384" y="110" style="font-size:9.5px">17</text>
  <text class="dg-t-xs" x="372" y="162">3 DUE SOON</text>
</svg>

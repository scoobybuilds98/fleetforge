<svg class="dg dg--art-equipment" viewBox="0 0 440 200" xmlns="http://www.w3.org/2000/svg">
  <title>Fleet on the road</title>
  <!-- status legend -->
  <rect class="dg-chip" x="12" y="14" width="104" height="22" rx="11"/>
  <circle class="dg-dot--ok" cx="25" cy="25" r="4"/><text class="dg-t-sm dg-t-start" x="35" y="29">Available</text>
  <rect class="dg-chip" x="12" y="42" width="104" height="22" rx="11"/>
  <circle class="dg-dot--info" cx="25" cy="53" r="4"/><text class="dg-t-sm dg-t-start" x="35" y="57">On lease</text>
  <rect class="dg-chip" x="12" y="70" width="104" height="22" rx="11"/>
  <circle class="dg-dot--warn" cx="25" cy="81" r="4"/><text class="dg-t-sm dg-t-start" x="35" y="85">Maintenance</text>

  <!-- road -->
  <line class="dg-line" x1="8" y1="174" x2="432" y2="174"/>
  <line class="dg-roll" x1="8" y1="188" x2="432" y2="188"/>

  <!-- trailer -->
  <rect class="dg-acc-soft" x="96" y="96" width="196" height="64" rx="7"/>
  <line class="dg-line-soft" x1="126" y1="100" x2="126" y2="156"/>
  <line class="dg-line-soft" x1="156" y1="100" x2="156" y2="156"/>
  <line class="dg-line-soft" x1="232" y1="100" x2="232" y2="156"/>
  <line class="dg-line-soft" x1="262" y1="100" x2="262" y2="156"/>
  <text class="dg-acc-t" x="194" y="132" style="font-size:12.5px;letter-spacing:.08em">STL-2021</text>
  <!-- tractor -->
  <rect class="dg-surface" x="298" y="108" width="58" height="52" rx="8"/>
  <path class="dg-surface-2" d="M326,114 h20 l8,20 h-28 z"/>
  <rect class="dg-surface" x="346" y="128" width="30" height="32" rx="7"/>
  <rect class="dg-ink" x="306" y="90" width="5" height="20" rx="2"/>
  <!-- wheels -->
  <g>
    <circle class="dg-surface" cx="128" cy="164" r="12"/><circle class="dg-ink" cx="128" cy="164" r="4.5"/>
    <circle class="dg-surface" cx="156" cy="164" r="12"/><circle class="dg-ink" cx="156" cy="164" r="4.5"/>
    <circle class="dg-surface" cx="262" cy="164" r="12"/><circle class="dg-ink" cx="262" cy="164" r="4.5"/>
    <circle class="dg-surface" cx="314" cy="164" r="12"/><circle class="dg-ink" cx="314" cy="164" r="4.5"/>
    <circle class="dg-surface" cx="362" cy="164" r="12"/><circle class="dg-ink" cx="362" cy="164" r="4.5"/>
  </g>

  <!-- GPS pin + signal -->
  <circle class="dg-pulse" cx="194" cy="92" r="10"/>
  <circle class="dg-pulse dg-pulse--2" cx="194" cy="92" r="10"/>
  <g class="dg-float">
    <path class="dg-acc" d="M194,86 c-10,-13 -15,-20 -15,-29 a15,15 0 1,1 30,0 c0,9 -5,16 -15,29 z"/>
    <circle class="dg-surface" cx="194" cy="57" r="5.5"/>
  </g>
  <text class="dg-t-xs" x="400" y="40">SAMSARA</text>
  <path class="dg-acc-flow" d="M214,52 C260,30 330,26 372,36"/>
  <circle class="dg-packet--acc" r="3.5"><animateMotion dur="2.2s" repeatCount="indefinite" path="M214,52 C260,30 330,26 372,36"/></circle>
</svg>

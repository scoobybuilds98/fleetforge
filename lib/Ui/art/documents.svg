<svg class="dg dg--art-documents" viewBox="0 0 440 200" xmlns="http://www.w3.org/2000/svg">
  <title>Every file in one place</title>
  <!-- folder back + tab -->
  <rect class="dg-surface-2" x="30" y="52" width="78" height="24" rx="7"/>
  <rect class="dg-surface-2" x="30" y="64" width="212" height="118" rx="10"/>

  <!-- files already filed -->
  <g transform="rotate(-6 96 84)">
    <rect class="dg-surface" x="56" y="38" width="80" height="92" rx="6"/>
    <rect class="dg-ink" x="68" y="52" width="46" height="5" rx="2.5" opacity=".55"/>
    <rect class="dg-ink" x="68" y="64" width="56" height="5" rx="2.5" opacity=".55"/>
    <rect class="dg-ink" x="68" y="76" width="38" height="5" rx="2.5" opacity=".55"/>
  </g>
  <g transform="rotate(5 170 76)">
    <rect class="dg-surface" x="130" y="30" width="80" height="92" rx="6"/>
    <rect class="dg-acc-soft" x="142" y="42" width="36" height="16" rx="8"/>
    <text class="dg-acc-t" x="160" y="54" style="font-size:9.5px">CVI</text>
    <rect class="dg-ink" x="142" y="66" width="56" height="5" rx="2.5" opacity=".55"/>
    <rect class="dg-ink" x="142" y="78" width="42" height="5" rx="2.5" opacity=".55"/>
  </g>

  <!-- folder front -->
  <rect class="dg-acc-soft" x="24" y="98" width="224" height="88" rx="10"/>
  <text class="dg-acc-t" x="136" y="136" style="font-size:12.5px">Documents</text>
  <text class="dg-t-xs" x="136" y="156">CUSTOMERS · UNITS · LEASES</text>

  <!-- a new upload on its way in -->
  <path class="dg-acc-flow" d="M352,130 C350,160 300,160 252,156"/>
  <circle class="dg-packet--acc" r="4"><animateMotion dur="2.2s" repeatCount="indefinite" path="M352,130 C350,160 300,160 252,156"/></circle>
  <g class="dg-float">
    <path class="dg-surface" d="M318,18 h58 l20,20 v76 a8,8 0 0 1 -8,8 h-70 a8,8 0 0 1 -8,-8 v-88 a8,8 0 0 1 8,-8 z"/>
    <path class="dg-line" d="M376,18 v14 a6,6 0 0 0 6,6 h14"/>
    <rect class="dg-acc" x="322" y="30" width="40" height="18" rx="9"/>
    <text class="dg-t-on-acc" x="342" y="43" style="font-size:9.5px">PDF</text>
    <rect class="dg-ink" x="322" y="58" width="62" height="5" rx="2.5" opacity=".55"/>
    <rect class="dg-ink" x="322" y="70" width="48" height="5" rx="2.5" opacity=".55"/>
    <rect class="dg-ink" x="322" y="82" width="56" height="5" rx="2.5" opacity=".55"/>
    <rect class="dg-warn-soft" x="322" y="96" width="66" height="18" rx="9"/>
    <circle class="dg-dot--warn" cx="333" cy="105" r="3"/>
    <text class="dg-t-xs dg-t-start" x="340" y="109">EXP 30D</text>
  </g>
  <rect class="dg-acc" x="290" y="168" width="72" height="24" rx="12"/>
  <text class="dg-t-on-acc" x="326" y="184">+ Upload</text>
</svg>

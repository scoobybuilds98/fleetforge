<svg class="dg dg--art-inspections" viewBox="0 0 440 200" xmlns="http://www.w3.org/2000/svg">
  <title>An inspection checklist</title>
  <!-- inspection type -->
  <rect class="dg-chip" x="16" y="16" width="124" height="22" rx="11"/>
  <circle class="dg-dot--info" cx="29" cy="27" r="4"/><text class="dg-t-sm dg-t-start" x="39" y="31">Pre-lease check</text>

  <!-- photo taken during the walk-around -->
  <g class="dg-float dg-float--2">
    <g transform="rotate(-6 186 46)">
      <rect class="dg-surface" x="158" y="20" width="56" height="52" rx="5"/>
      <rect class="dg-acc-faint" x="164" y="26" width="44" height="30" rx="3"/>
      <circle class="dg-acc" cx="198" cy="34" r="3.5"/>
      <path class="dg-acc-soft" d="M166,54 l12,-14 l9,9 l6,-6 l13,11 z"/>
      <text class="dg-t-xs" x="186" y="67">PHOTO</text>
    </g>
  </g>

  <!-- trailer being checked -->
  <line class="dg-line" x1="8" y1="160" x2="238" y2="160"/>
  <rect class="dg-acc-soft" x="16" y="92" width="182" height="48" rx="6"/>
  <line class="dg-line-soft" x1="46" y1="96" x2="46" y2="136"/>
  <line class="dg-line-soft" x1="168" y1="96" x2="168" y2="136"/>
  <text class="dg-acc-t" x="107" y="120" style="font-size:12px;letter-spacing:.08em">TRL-118</text>
  <rect class="dg-ink" x="36" y="140" width="5" height="20" rx="2"/>
  <circle class="dg-surface" cx="136" cy="149" r="10"/><circle class="dg-ink" cx="136" cy="149" r="4"/>
  <circle class="dg-surface" cx="162" cy="149" r="10"/><circle class="dg-ink" cx="162" cy="149" r="4"/>
  <!-- magnifier over the tyres -->
  <g class="dg-float">
    <circle class="dg-acc-faint" cx="149" cy="148" r="21"/>
    <circle class="dg-acc-line" cx="149" cy="148" r="21" style="stroke-width:3"/>
    <line class="dg-acc-line" x1="164" y1="163" x2="178" y2="177" style="stroke-width:6"/>
  </g>

  <!-- findings go onto the form -->
  <path class="dg-acc-flow" d="M202,116 C224,116 236,108 256,108"/>
  <circle class="dg-packet--acc" r="3.5"><animateMotion dur="1.8s" repeatCount="indefinite" path="M202,116 C224,116 236,108 256,108"/></circle>

  <!-- clipboard -->
  <rect class="dg-surface" x="262" y="24" width="154" height="166" rx="12"/>
  <rect class="dg-acc" x="314" y="14" width="50" height="18" rx="6"/>
  <circle class="dg-surface" cx="339" cy="20" r="3"/>
  <text class="dg-t-xs" x="339" y="50">CHECKLIST</text>

  <rect class="dg-surface-2" x="276" y="63" width="18" height="18" rx="4"/>
  <path class="dg-check dg-grow" d="M280,72 l4,4 l7,-8" style="stroke-width:2.5"/>
  <text class="dg-t-sm dg-t-start" x="302" y="76">Tires</text>
  <text class="dg-t-xs dg-t-xs--qbo" x="392" y="76">OK</text>

  <rect class="dg-surface-2" x="276" y="89" width="18" height="18" rx="4"/>
  <path class="dg-check dg-grow" d="M280,98 l4,4 l7,-8" style="stroke-width:2.5;animation-delay:.35s"/>
  <text class="dg-t-sm dg-t-start" x="302" y="102">Lights</text>
  <text class="dg-t-xs dg-t-xs--qbo" x="392" y="102">OK</text>

  <rect class="dg-surface-2" x="276" y="115" width="18" height="18" rx="4"/>
  <path class="dg-check dg-grow" d="M280,124 l4,4 l7,-8" style="stroke-width:2.5;animation-delay:.7s"/>
  <text class="dg-t-sm dg-t-start" x="302" y="128">Brakes</text>
  <text class="dg-t-xs dg-t-xs--qbo" x="392" y="128">OK</text>

  <circle class="dg-pulse" cx="285" cy="150" r="9"/>
  <rect class="dg-surface-2" x="276" y="141" width="18" height="18" rx="4"/>
  <text class="dg-t-sm dg-t-start" x="302" y="154">Body</text>

  <!-- sign-off -->
  <line class="dg-line-soft" x1="276" y1="178" x2="400" y2="178"/>
  <path class="dg-acc-line" d="M280,174 c4,-9 8,-9 10,-2 s4,7 8,0 s6,-9 10,-2 s4,5 12,1" style="stroke-width:1.6"/>
  <text class="dg-t-xs" x="372" y="174">SIGN-OFF</text>
</svg>
